<!DOCTYPE html>
<html>
<head>
  <title>Employee System</title>
  <link rel="stylesheet" href="exp5.css">
</head>
<body>
  <h2>Employee Management System</h2>

  <div>
    <label>Name: </label>
    <input type="text" id="name"><br>

    <label>ID: </label>
    <input type="text" id="id"><br>

    <label>Salary: </label>
    <input type="number" id="salary"><br>

    <label>Department: </label>
    <input type="text" id="dept"><br>

    <button onclick="addEmployee()">Add Employee</button>
  </div>

  <div class="buttons">
    <button onclick="displayEmployees()">Display All</button>
    <button onclick="filterSalary()">Filter Salary > 50000</button>
    <button onclick="totalSalary()">Total Salary</button>
    <button onclick="averageSalary()">Average Salary</button>
    <button onclick="countDept()">Count by Department</button>
  </div>

  <div id="result"></div>

  <script src="exp5.js"></script>
</body>
</html>
