<!DOCTYPE html>
<html>
<head>
  <title>DOM Manipulation Demo</title>
  <link rel="stylesheet" href="exp6.css">
</head>
<body>
  <h2 id="heading">Welcome to Experiment 6</h2>

  <input type="text" id="message" placeholder="Enter a message">
  
  <div class="buttons">
    <button id="btnHeading">Change Heading</button>
    <button id="btnBg">Change Background</button>
    <button id="btnFont">Change Font Size</button>
    <button id="btnToggle">Show/Hide Paragraph</button>
    <button id="btnReset">Reset Page</button>
  </div>

  <p id="para">This is a sample paragraph that can be shown or hidden.</p>

  <script src="exp6.js"></script>
</body>
</html>
