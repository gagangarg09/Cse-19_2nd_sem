<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>School Result Table</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f9f9f9;
    }
    table {
      width: 70%;
      border-collapse: collapse;
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    caption {
      font-size: 1.5em;
      margin-bottom: 10px;
      font-weight: bold;
      color: #333;
    }
    th, td {
      border: 1px solid #333;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #4CAF50;
      color: white;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
  </style>
</head>
<body>

  <table>
    <caption>School Examination Results - Class 10</caption>
    <tr>
      <th rowspan="2">Student Name</th>
      <th colspan="3">Subjects</th>
      <th rowspan="2">Total Marks</th>
    </tr>
    <tr>
      <th>Math</th>
      <th>Science</th>
      <th>English</th>
    </tr>
    <tr>
      <td>Rahul Sharma</td>
      <td>85</td>
      <td>78</td>
      <td>90</td>
      <td>253</td>
    </tr>
    <tr>
      <td>Priya Singh</td>
      <td>92</td>
      <td>88</td>
      <td>95</td>
      <td>275</td>
    </tr>
    <tr>
      <td>Amit Verma</td>
      <td>70</td>
      <td>65</td>
      <td>80</td>
      <td>215</td>
    </tr>
  </table>

</body>
</html>
